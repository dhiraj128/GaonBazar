name: GaonBazaar E2E Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: Start FastAPI Backend
      run: |
        python run_server.py 8001 &
        sleep 5

    - name: Run Customer App Tests
      run: python test_mobile_e2e.py
      continue-on-error: true

    - name: Run Vendor App Tests
      run: python test_vendor_e2e.py
      continue-on-error: true

    - name: Run Runner App Tests
      run: python test_runner_e2e.py
      continue-on-error: true
      
    - name: Run Admin Dashboard Tests
      run: python test_admin_e2e.py
      continue-on-error: true

    - name: Upload Test Artifacts (Screenshots & Reports)
      uses: actions/upload-artifact@v4
      with:
        name: gaonbazaar-test-results
        path: |
          screenshots/
          *.txt
