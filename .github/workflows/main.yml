name: GaonBazaar E2E Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt httpx pytest
        playwright install --with-deps chromium

    - name: Start FastAPI Backend
      run: |
        python run_server.py 8001 &
        sleep 5

    - name: Run Trust Score Tests
      run: python test_trust_score.py

    - name: Run Security Tests
      run: python test_security.py

    - name: Run Customer App Tests
      run: python test_mobile_e2e.py

    - name: Run Vendor App Tests
      run: python test_vendor_e2e.py

    - name: Run Runner App Tests
      run: python test_runner_e2e.py
      
    - name: Run Admin Dashboard Tests
      run: python test_admin_e2e.py

    - name: Upload Test Artifacts (Screenshots & Reports)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gaonbazaar-test-results
        path: |
          screenshots/
          *.txt
